version: "3.9"

# Minimal single-instance stack: no Postgres/Redis containers required.
# API falls back to SQLite (file-backed) and in-memory cache automatically.
services:
  mock-model:
    build:
      context: ./services/mock-model
    ports:
      - "8001:8001"

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: development
      POSTGRES_DSN: sqlite+aiosqlite:////app/data/agent.db
      REDIS_URL: redis://127.0.0.1:6399/0
      MODEL_MODE: mock
      MODEL_BASE_URL: http://mock-model:8001/v1
      MODEL_NAME: Qwen/Qwen2.5-Coder-1.5B-Instruct
      DEV_API_KEY: dev-local-key
      REQUIRE_API_KEY: "true"
      SANDBOX_MODE: local
      ALLOWED_WORKSPACE_ROOT: /workspace/coding-agent
    ports:
      - "8080:8080"
    volumes:
      - agent-data:/app/data
      - ./:/workspace/coding-agent
    depends_on:
      - mock-model

  # Only started with: docker compose --profile gpu up -d --build vllm
  vllm:
    build:
      context: ./inference
    profiles: ["gpu"]
    runtime: nvidia
    environment:
      MODEL_NAME: Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
      MAX_MODEL_LEN: 8192
      GPU_MEMORY_UTILIZATION: 0.85
      QUANTIZATION: awq
    ports:
      - "8002:8001"

volumes:
  agent-data:
