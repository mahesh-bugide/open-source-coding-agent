[project]
name = "enterprise-ai-coding-agent-api"
version = "0.1.0"
description = "MVP backend for an enterprise self-hosted AI coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.9",
  "aiosqlite==0.21.0",
  "alembic==1.16.5",
  "httpx==0.28.1",
  "redis==5.2.1",
  "tree-sitter==0.25.1",
  "python-multipart==0.0.20"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.13.0",
  "mypy==1.18.1",
  "types-redis==4.6.0.20241004"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict_optional = true
ignore_missing_imports = true
