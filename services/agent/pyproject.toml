[project]
name = "enterprise-ai-coding-agent-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.11.7"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
